spring.application.name=Web Based Banking System

spring.datasource.url=jdbc:sqlserver://HARSHA-LOQ\\SQLEXPRESS;databaseName=BankingSystemDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.security.user.name=admin
spring.security.user.password=${APP_PASSWORD}